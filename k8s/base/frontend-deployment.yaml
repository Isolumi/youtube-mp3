apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-mp3-frontend
  labels:
    app.kubernetes.io/name: youtube-mp3-frontend
    app.kubernetes.io/part-of: youtube-mp3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: youtube-mp3-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: youtube-mp3-frontend
        app.kubernetes.io/part-of: youtube-mp3
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/isolumi/youtube-mp3-frontend:development
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
