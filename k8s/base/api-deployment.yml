apiVersion: apps/v1
kind: Deployment
metadata:
  name: yootoob-mp3-api
  labels:
    app.kubernetes.io/name: yootoob-mp3-api
    app.kubernetes.io/part-of: yootoob-mp3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yootoob-mp3-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yootoob-mp3-api
        app.kubernetes.io/part-of: yootoob-mp3
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/isolumi/yootoob-mp3-api:development
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ALLOWED_ORIGINS
              value: "https://yootoob-mp3.example.com"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: job-files
              mountPath: /tmp/yootoob_mp3
      volumes:
        - name: job-files
          emptyDir: {}
