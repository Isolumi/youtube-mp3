apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: youtube-mp3
  labels:
    app.kubernetes.io/name: youtube-mp3
    app.kubernetes.io/part-of: youtube-mp3
spec:
  ingressClassName: traefik
  rules:
    - host: youtube-mp3.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: youtube-mp3-frontend
                port:
                  name: http
