apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yootoob-mp3-dumachine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Isolumi/youtube-mp3.git
    targetRevision: development
    path: k8s/overlays/dumachine
  destination:
    server: https://kubernetes.default.svc
    namespace: yootoob-mp3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
