name: Build and publish images

on:
  push:
    branches: [development]
    paths-ignore:
      - 'k8s/overlays/starmoon/kustomization.yaml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: isolumi

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/youtube-mp3-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/youtube-mp3-api:development

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/youtube-mp3-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/youtube-mp3-frontend:development

      - name: Update Argo image tags
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/g" k8s/overlays/starmoon/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/starmoon/kustomization.yaml
          git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
          git push
